name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build the client in "direct" mode: opt in via IS_DIRECT_MODE and bake
      # both base URLs into the bundle. Ticks reads (GET /api/v1/ticks/*) and
      # the fixed-window ledger feed (GET /api/v1/transactions/50) go through
      # the CloudFront distribution (VITE_CDN_BASE_URL secret — the 14s edge cache
      # protects the 1-RCU DynamoDB table and the DSQL ledger), while all dynamic
      # routes (portfolio, orders, assistant) hit the HTTP API Gateway directly
      # (VITE_API_BASE_URL secret) to fix CORS and allow zero-buffered LLM
      # streaming. Set both secrets in the repo settings.
      - name: Build client (direct CloudFront + API Gateway mode)
        run: npm run build --workspace client
        env:
          IS_DIRECT_MODE: "true"
          VITE_CDN_BASE_URL: ${{ secrets.VITE_CDN_BASE_URL }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
